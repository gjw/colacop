# Requirements derived from discovery facts.
# Requirements are design commitments; facts remain the provenance-bearing source claims.

requirements:
  - id: REQ-001
    title: "Support fast, simple single-label review"
    statement: "The prototype must let a compliance agent review a single label against submitted application fields through a simple, obvious workflow that reduces manual comparison effort."
    priority: must
    status: proposed
    supported_by:
      - F-001
      - F-002
      - F-004
      - F-006
      - F-013
      - F-044
    rationale: "The review operation is high-volume, handled by a limited team, and currently depends on manual comparison against label artwork."
    candidate_features:
      - "Review queue"
      - "Single-label review detail view"
      - "Side-by-side application data and extracted label data"

  - id: REQ-002
    title: "Keep the agent experience low-friction"
    statement: "The prototype must be usable by agents with varying technical comfort, with obvious controls, minimal navigation, and no workflow steps that make review slower or harder than manual review."
    priority: must
    status: proposed
    supported_by:
      - F-011
      - F-012
      - F-013
      - F-027
      - F-028
      - F-031
    rationale: "Adoption depends on the tool fitting the existing agent workflow and avoiding the usability failures of past modernization efforts."
    candidate_features:
      - "Queue-first interface"
      - "Clear status labels"
      - "Minimal required controls per review"

  - id: REQ-003
    title: "Avoid blocking review on long-running analysis"
    statement: "The prototype must process submitted label files asynchronously so verification results are available before or shortly after an agent opens them for review."
    priority: must
    status: proposed
    supported_by:
      - F-009
      - F-010
      - F-014
      - F-015
      - F-016
      - F-031
    rationale: "The prior vendor pilot failed because agents had to wait interactively for slow processing; asynchronous processing also supports batch intake."
    acceptance_notes:
      - "Preprocessed labels should show results immediately in the review UI."
      - "Labels submitted interactively should enter the same processing queue and expose status while processing."
    candidate_features:
      - "File ingestion watcher"
      - "Background processing worker"
      - "Queue status view"

  - id: REQ-004
    title: "Verify core label fields against application data"
    statement: "The prototype must compare extracted label information against provided application fields for at least brand name, alcohol content, and government warning. This requirement covers Layer 2 (comparison) of the verification model defined in F-045; Layer 1 well-formedness checks are covered by REQ-011."
    priority: must
    status: proposed
    supported_by:
      - F-004
      - F-005
      - F-007
      - F-008
      - F-033
      - F-044
      - F-045
      - F-051
      - F-052
      - F-053
      - F-054
    rationale: "The main automation opportunity is reducing routine matching between application data and information visible on the label. The TTB mandatory-field rules (F-051/F-053/F-054) define the comparable surface; the alcohol-content format rule (F-052) defines what a regulation-conformant alcohol-content string looks like for wine."
    candidate_features:
      - "Label field extraction"
      - "Application field input or fixture data"
      - "Per-field verification results"

  - id: REQ-005
    title: "Apply field-specific matching rules"
    statement: "The prototype must apply field-specific comparison behavior: tolerant matching for brand-name variations where appropriate, strict matching for government warning text and capitalization, and tolerance-aware matching for alcohol content."
    priority: must
    status: proposed
    supported_by:
      - F-029
      - F-030
      - F-034
      - F-035
      - F-036
      - F-038
      - F-047
      - F-048
      - F-052
    rationale: "Compliance review is not uniformly fuzzy or exact; different label fields require different matching semantics. The warning's exact wording (F-047) and the GOVERNMENT WARNING capitalization+bold rule (F-048) ground the strict-matching policy. The wine alcohol-content tolerances (F-052) ground the field-specific tolerance policy: alcohol content is a numeric comparison with regulation-defined slack, not a string-equality check."
    candidate_features:
      - "Normalized brand-name comparison"
      - "Strict government warning comparison"
      - "Rule-specific result explanations"

  - id: REQ-006
    title: "Separate matches, mismatches, and cases needing review"
    statement: "The prototype must distinguish clear matches, clear mismatches, and cases that need human review, with concise explanations for each result."
    priority: must
    status: proposed
    supported_by:
      - F-029
      - F-030
      - F-034
      - F-037
      - F-039
      - F-040
    rationale: "Some differences are acceptable, some are compliance failures, and some inputs may not support a reliable automated decision."
    candidate_features:
      - "Pass/fail/needs-review status model"
      - "Per-field confidence or explanation"
      - "Unreadable image handling"

  - id: REQ-007
    title: "Operate as a standalone proof of concept"
    statement: "The prototype must operate without direct COLA integration and without persistent storage of sensitive submitted data."
    priority: must
    status: proposed
    supported_by:
      - F-021
      - F-022
      - F-023
      - F-024
    rationale: "The take-home prototype is intended to demonstrate feasibility without entering the authorization and retention concerns of production integration."
    out_of_scope_facts:
      - F-017
      - F-018
      - F-019
      - F-020
    candidate_features:
      - "Standalone local application"
      - "No direct COLA API dependency"
      - "No long-term sensitive document retention"

  - id: REQ-008
    title: "Support batch-oriented ingestion"
    statement: "The prototype must support file-based batch ingestion, allowing multiple label applications to be added to a queue and processed without requiring agents to handle each one synchronously."
    priority: should
    status: proposed
    supported_by:
      - F-014
      - F-015
      - F-016
      - F-025
      - F-026
    rationale: "Batch intake addresses peak-season submissions and can avoid fragile user-facing dependencies on blocked external services."
    candidate_features:
      - "Watched incoming directory"
      - "Queued processing statuses"
      - "Processed and failed item lists"

  - id: REQ-009
    title: "Handle imperfect label images gracefully"
    statement: "The prototype should detect when image quality prevents reliable verification and report that limitation clearly. Per-field extraction quality is reported separately from the verdict via a low/med/hi extraction_confidence indicator on each Layer 1 field result, so a reviewer can distinguish 'the label says X and X is wrong' from 'we think the label says X but the image was hard to read.'"
    priority: should
    status: proposed
    supported_by:
      - F-039
      - F-040
      - F-041
      - F-056
    rationale: "Real submitted labels may be hard to read because of angle, lighting, or glare; the prototype should fail clearly instead of producing misleading results. F-056 records the design choice to surface read-quality at the per-field level rather than as a second verdict axis."
    acceptance_notes:
      - "Per-field Layer 1 results expose an extraction_confidence value in {low, med, hi}."
      - "extraction_confidence is rendered as a UI badge alongside the field, not as a numeric column or as part of the verdict."
      - "The overall verdict surface remains REQ-006's pass / fail / needs_review trichotomy regardless of confidence buckets."
    candidate_features:
      - "Per-field extraction_confidence enum"
      - "Low-confidence read indicator badge in review UI"
      - "Needs-review status for labels where confidence is uniformly low"

  - id: REQ-010
    title: "Persist processing and review state"
    statement: "The prototype must persist ingestion status, extracted fields, verification results, and review outcomes so agents can review already-processed work and see pending or failed items."
    priority: must
    status: proposed
    supported_by:
      - F-009
      - F-014
      - F-015
      - F-016
      - F-022
      - F-031
    rationale: "Asynchronous and batch-oriented processing requires durable queue state and review results, regardless of the eventual database choice."
    candidate_features:
      - "Job status records"
      - "Stored verification results"
      - "Review outcome tracking"

  - id: REQ-011
    title: "Run label well-formedness checks independently of application data"
    statement: "The prototype must apply TTB regulatory well-formedness checks (government warning exact text, mandatory-field presence, alcohol-content format, and similar) on every label, whether or not application data is supplied. Comparison failures (Layer 2, label-vs-application) and well-formedness failures (Layer 1, label-vs-regulation) must be reported separately so a reviewer can distinguish a label that is intrinsically non-compliant from one that is merely inconsistent with its application."
    priority: must
    status: proposed
    supported_by:
      - F-029
      - F-034
      - F-044
      - F-045
      - F-047
      - F-048
      - F-050
      - F-051
      - F-052
      - F-053
      - F-054
    out_of_scope_facts:
      - F-049
      - F-055
    rationale: "The verification model is two-layer (F-045). Without an explicit requirement that Layer 1 runs unconditionally, an implementation could short-circuit when application data is missing and silently miss regulatory violations. This requirement also forms the basis for partial-input behavior: when application data is null, Layer 2 fails or reports needs_application_data, but Layer 1 still produces a meaningful result. Layer 1 is now grounded in TTB regulatory text (F-047, F-048, F-050 for the warning; F-051/F-053/F-054 for mandatory fields by commodity; F-052 for the wine alcohol-content format). Type-size requirements (F-049) and class/type controlled vocabulary (F-055) are deliberately out of scope for this prototype."
    acceptance_notes:
      - "Submitting a label with no application data still produces a complete Layer 1 well-formedness report."
      - "Layer 1 and Layer 2 results are visually distinguishable in the review UI and stored as separate result categories."
      - "Per-field application gaps (e.g., JSON present but missing countryOfOrigin) are reported as needs_application_data for that field specifically, not the whole label."
    candidate_features:
      - "Separate well-formedness and comparison result categories"
      - "Government warning exact-text rule check"
      - "Required-fields-present rule check"
      - "ABV format rule check"

  - id: REQ-012
    title: "Accept paired label image and application data by filename stem"
    statement: "The prototype must accept submissions as a pair of files sharing a filename stem: an image file (.jpg, .jpeg, .png, .webp) and a JSON file (.json). Files in a pair may arrive in either order or simultaneously; the system must pair them by stem and process what it can. When only the image is present, Layer 1 runs and Layer 2 reports needs_application_data; when the JSON later arrives, Layer 2 re-runs without re-running Layer 1. When only the JSON is present, the job is held in awaiting_label state until the image arrives. Browser upload mirrors this contract: a browser submission accepts a paired image+JSON or a label-only image and produces the same internal representation as a watched-directory drop."
    priority: must
    status: proposed
    supported_by:
      - F-044
      - F-045
      - F-046
    rationale: "The input frame is a non-trivial choice with real alternatives (zip+manifest, multipart-only, DB lookup by COLA ID). Recording it as a requirement rather than an implementation detail makes the tradeoff explicit and prevents future scope drift toward unsupported ingestion modes."
    acceptance_notes:
      - "A label image with no JSON sibling produces a job with Layer 1 results and Layer 2 marked needs_application_data."
      - "A JSON file with no image sibling produces a job in awaiting_label status."
      - "When the missing sibling later arrives, the existing job is updated rather than a new job created."
      - "Layer 1 results are stable across Layer 2 re-runs (the image has not changed)."
      - "The watcher uses chokidar awaitWriteFinish to avoid firing on partially-written files."
    candidate_features:
      - "Watched-directory ingestion for both image and JSON files"
      - "Upsert-by-stem job creation"
      - "awaiting_label job state for JSON-first arrivals"
      - "Layer 2 re-run path that does not re-run Layer 1"
      - "Browser upload accepting paired or label-only submissions"
