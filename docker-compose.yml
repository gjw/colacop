services:
  db:
    image: postgres:16-alpine
    container_name: colacop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: colacop
      POSTGRES_PASSWORD: colacop
      POSTGRES_DB: colacop
    ports:
      - "5432:5432"
    volumes:
      - colacop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colacop -d colacop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  colacop-db:
