server {
    server_name colacop.foramerica.dev;

    client_max_body_size 25m;

    # API + uploads (Express on :3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # Sample fixture downloads (jpg/json pairs)
    location /fixtures/ {
        alias /root/colacop/fixtures/pairs/;
    }

    # SPA: Vite build output
    location / {
        root /root/colacop/dist/web;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/colacop.foramerica.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/colacop.foramerica.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = colacop.foramerica.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name colacop.foramerica.dev;
    return 404; # managed by Certbot


}