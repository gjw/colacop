  - id: F-045
    statement: "The verification model has two distinct layers. Layer 1 (well-formedness) checks the label against TTB regulatory requirements that hold regardless of any application data: government warning exact text, mandatory-field presence, alcohol-content format, and similar. Layer 2 (comparison) checks extracted label fields against application data. When application data is null or absent, Layer 1 still runs in full; Layer 2 reports comparison failures or a needs_application_data status. Layer 1 and Layer 2 failures are reported separately so a reviewer can see whether a label is intrinsically non-compliant or merely inconsistent with its application."
    claim_kind: inferred
    fact_type: scope_decision
    source:
      id: S-001
      file: assignment.md
      source_context: "Synthesis of regulatory facts, interview content, and the F-044 interpretation, settled 2026-04-29"
      excerpt: "Jenny Park (F-029, F-034 et al.) emphasizes that warning-text rules are exact and external to any application; Sarah Chen (F-004) and Dave Morrison (F-030) describe the comparison workflow. The two layers compose: a label can be well-formed and yet inconsistent with its application, or be consistent with its application yet violate a regulation."
    authority:
      scope: project
      level: high
      rationale: "Records the design commitment that well-formedness is a separate layer from comparison; without this fact, REQ-011 has no provenance."
    related_facts:
      - F-029
      - F-034
      - F-044
    tags:
      - scope_decision
      - verification_layers
      - well_formedness
      - comparison_workflow

  - id: F-046
    statement: "The prototype pairs a label image with its corresponding application data using a shared filename stem (e.g., 42.jpg + 42.json). Application data is JSON containing the matchable label fields (brand name, class/type, alcohol content, net contents, producer name and address, optional country of origin); the government warning is not part of application data because it is regulation-defined. The mapping is one-to-one: one image pairs with one application. Files in a pair may arrive in either order or simultaneously; when only one is present, the system processes what it can (Layer 1 if image is present; nothing if only JSON is present) and completes Layer 2 when the missing file later arrives. Bundled inputs (zip with manifest) and out-of-band application lookups are not supported. This is a deliberate simplification; a production deployment would likely use COLA-system filing IDs and a richer ingestion contract."
    claim_kind: inferred
    fact_type: scope_decision
    source:
      id: S-001
      file: assignment.md
      source_context: "Design decision settled with Chair on 2026-04-29; informed by COLA real-world filing semantics (one label per filing) and assignment text constraints (no manifest, no zip, no out-of-band fetch implied)."
      excerpt: "The assignment does not prescribe a specific input format; the simplest plausible analog of a real workflow is paired files with stem-matched names, which is what we adopted."
    authority:
      scope: project
      level: high
      rationale: "Documents the input frame so future readers do not silently re-derive a different ingestion contract (e.g., zip+manifest, multipart-only, DB lookup)."
    related_facts:
      - F-044
      - F-014
      - F-022
    tags:
      - scope_decision
      - input_frame
      - file_pairing
      - ingestion

