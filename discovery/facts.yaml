  - id: F-056
    statement: "Per-field extraction confidence and overall verification verdict are kept on separate axes. Layer 1 per-field results carry an extraction_confidence enum with three buckets (low, med, hi) derived from the label-extraction model's per-field signal (e.g., logprobs or self-rated score); this is a model-read-quality indicator, not a verdict. The overall verdict remains REQ-006's pass / fail / needs_review trichotomy. A verdict-level numeric confidence score was considered and rejected: pass / fail / needs_review already encodes how sure the system is about compliance, adding a numeric axis on top would force agents to interpret two signals where one suffices, and a numeric cutoff would tempt automatic-pass behavior that contradicts the human-in-the-loop posture argued for by F-029 and F-037."
    claim_kind: inferred
    fact_type: scope_decision
    source:
      id: S-001
      file: assignment.md
      source_context: "Design decision settled with Chair on 2026-04-29 after a confidence-modeling discussion; supersedes the cc-wvs decision ticket."
      excerpt: "F-039 (bad angles, glare, lighting) makes low-confidence reads a real category we have to surface; REQ-006's verdict trichotomy already encodes compliance certainty, so a separate verdict-level confidence score is not added."
    authority:
      scope: project
      level: high
      rationale: "Records both the positive decision (per-field extraction_confidence exists as a low/med/hi enum) and the negative decision (no verdict-level confidence score), so neither is silently re-litigated. The schema impact lands in cc-xog's eventual Layer 1 result shape; the negative decision affects how REQ-006 is interpreted."
    related_facts:
      - F-039
      - F-029
      - F-037
    tags:
      - scope_decision
      - extraction_confidence
      - verification_layers
      - human_in_loop

  - id: F-057
    statement: "Same-stem replacement of an already-ingested file (image or JSON) is undefined behavior in the prototype. Once a job has been created for a stem and at least one layer has run, dropping a new file with the same stem is not guaranteed to invalidate or re-run prior layer results, and the prototype will not detect content change versus identity. A production deployment would version inputs (e.g., content-hash or COLA filing version) and re-run affected layers on change; the prototype does not. This is acceptable because the take-home use case is one-shot ingestion of a label and its application, not iterative editing."
    claim_kind: inferred
    fact_type: scope_decision
    source:
      id: S-001
      file: assignment.md
      source_context: "Design decision settled with Chair on 2026-04-29 while pinning the cc-xog state model."
      excerpt: "The prototype's pairing contract (F-046) treats the stem as the identity of a (label, application) pair; content-versioning is out of scope."
    authority:
      scope: project
      level: high
      rationale: "Records a deliberate boundary on the file-pairing contract so future readers do not assume idempotent replay or content-change detection."
    related_facts:
      - F-046
    tags:
      - scope_decision
      - file_pairing
      - ingestion
      - out_of_prototype_scope
