      speaker: Sarah Chen
      speaker_role: Deputy Director of Label Compliance
      source_context: "Conducted Tuesday, 3:15 PM"
      excerpt: "A lot of what we do is just... matching. Like literally just making sure the number on the form is the same as the number on the label."
    authority:
      scope: workflow
      level: high
    tags:
      - label_review
      - matching
      - automation_opportunity

