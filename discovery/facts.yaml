  - id: F-004
    statement: "Agents review label applications by comparing submitted label artwork against application data."
    claim_kind: stated
    fact_type: workflow_fact
    source:
      id: S-001
      file: discovery/sources/S-001-sarah-chen-deputy-director-label-compliance.md
      speaker: Sarah Chen
      speaker_role: Deputy Director of Label Compliance
      source_context: "Conducted Tuesday, 3:15 PM"
      excerpt: "An agent pulls up an application, looks at the label artwork, and checks that what's on the label matches what's in the application."
    authority:
      scope: workflow
      level: high
    tags:
      - label_review
      - verification
      - agent_workflow

  - id: F-005
    statement: "Common review checks include brand name, ABV, and government warning presence."
    claim_kind: stated
    fact_type: workflow_fact
    source:
      id: S-001
      file: discovery/sources/S-001-sarah-chen-deputy-director-label-compliance.md
      speaker: Sarah Chen
      speaker_role: Deputy Director of Label Compliance
      source_context: "Conducted Tuesday, 3:15 PM"
      excerpt: "Brand name matches? Check. ABV is correct? Check. Government warning is there? Check."
    authority:
      scope: workflow
      level: high
    tags:
      - label_review
      - brand_name
      - alcohol_content
      - government_warning

  - id: F-006
    statement: "A simple label application review takes about 5 to 10 minutes, and reviews take longer when issues are present."
    claim_kind: stated
    fact_type: workflow_timing_fact
    source:
      id: S-001
      file: discovery/sources/S-001-sarah-chen-deputy-director-label-compliance.md
      speaker: Sarah Chen
      speaker_role: Deputy Director of Label Compliance
      source_context: "Conducted Tuesday, 3:15 PM"
      excerpt: "It takes maybe 5-10 minutes per application for a simple one, longer if there are issues."
    authority:
      scope: workflow
      level: high
    tags:
      - label_review
      - review_time

